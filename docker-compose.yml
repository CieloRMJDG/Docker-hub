services:
  nginx-proxy-manager:
      image: 'jc21/nginx-proxy-manager:latest'
      container_name: proxy-manager
      restart: always
      ports:
        - "80:80" #Http
        - "81:81" #Administración de la API
        - "443:443" #Https
      volumes:
        - ./npm_data:/data
        - ./npm_letsencrypt:/etc/letsencrypt

  servidor-bd-082:
    image: mysql:8.0
    container_name: servidor-bd-082
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - mi-red

  backend-082:
    build: .
    container_name: backend-082
    restart: always
    depends_on:
      - servidor-bd-082
    expose:
      - "5050"
    networks:
      - mi-red

networks:
  mi-red:
    driver: bridge