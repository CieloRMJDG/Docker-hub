    name: Publicar imagen en docker hub

    on:
        push:
            branches: ["main"]

    jobs:
        build-and-push:
            runs-on: ubuntu-latest

            steps:
                - name: Descargar codigo
                  uses: actions/checkout@v3

                - name: Iniciar sesión en Docker Hub
                  uses: docker/login-action@v2
                  with:
                      username: ${{ secrets.DOCKER_USERNAME }}
                      password: ${{ secrets.DOCKER_PASSWORD }}

                - name: Build and push Docker image
                  uses: docker/build-push-action@v4
                  with:
                      context: .
                      push: true
                      tags: sky2712/mi-api:latest
                
                - name: Desplegar en el servidor cloud
                  uses: appleboy/ssh-action@v1.0.03
                  with:
                    host: ${{ secrets.SERVER_HOST }}
                    username: ${{ secrets.SERVER_USER }}
                    key: ${{ secrets.SERVER_SSH_KEY }}
                    script: |
                      cd ~/Docker-hub
                      docker pull app-backend
                      docker up -d 
                      docker rm mi-api || true
                      docker run -d --name mi-api -p 80:80 sky2712/mi-api:latest